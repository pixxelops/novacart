spring.application.name=ecommerce
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_app_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate 7 no longer provides MySQL8Dialect; MySQLDialect covers modern MySQL versions.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
jwt.secret=${JWT_SECRET:dev-secret-please-change-this-to-a-secure-key-012345678901}
jwt.expiration=86400000
file.upload-dir=uploads
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
